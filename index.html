<!-- Look: "white plaster & crimson silk", from the couple's photo (red gown, black suit, white sunlit wall) -->
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=Noto+Serif+Telugu:wght@400;500;600&family=Gurajada&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4f1; --paper:#ffffff; --ink:#140d0f; --ink-soft:#3d282c; --accent:#b3122e; --accent-ink:#fff;
  --line:#eadedb; --night:#150b0e; --crimson:#b3122e; --crimson-deep:#7d0b20; --gold:#b89363;
  --script:"Italianno",cursive; --serif:"Bodoni Moda",Georgia,serif; --caps:"Bodoni Moda",Georgia,serif;
  --te:"Noto Serif Telugu","Gautami",serif; --te-d:"Gurajada","Noto Serif Telugu",serif;
  --radius:4px; --shadow:0 18px 40px -18px rgba(29,21,23,.28),0 4px 12px -4px rgba(29,21,23,.08);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#ece6e1;color:var(--ink);font:500 17px/1.65 var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
/* sunlit plaster: soft light, faint trowel noise */
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;box-shadow:0 0 60px rgba(0,0,0,.12);
  background:
    radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.9),transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.018 .045' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .48  0 0 0 .16 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='160' viewBox='0 0 120 160'><g fill='none' stroke='%23b89363' stroke-width='.9' opacity='.2'><path d='M60 8c14 18 14 34 0 48c-14-14-14-30 0-48z'/><path d='M60 56c-10 10-26 12-38 4c10-14 26-14 38-4zM60 56c10 10 26 12 38 4c-10-14-26-14-38-4z'/><path d='M60 56v40M60 96c-8 8-20 10-30 4M60 96c8 8 20 10 30 4'/><circle cx='60' cy='120' r='3'/><path d='M0 80c16 0 22-10 22-22M120 80c-16 0-22-10-22-22M0 80c16 0 22 10 22 22M120 80c-16 0-22 10-22 22'/></g></svg>") 0 0/120px 160px,
    var(--bg)}
.te{font-family:var(--te)}
.te-d{font-family:var(--te-d);line-height:1.2}
.caps{font-family:var(--caps);letter-spacing:.3em;text-transform:uppercase;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.script{font-family:var(--script);font-weight:400;line-height:.95;color:var(--ink)}
h2.script{font-size:clamp(46px,14vw,60px);white-space:nowrap;text-align:center;margin-bottom:4px;color:var(--crimson)}
section{padding:68px 24px;position:relative}
.sub{text-align:center;color:var(--ink-soft);font-weight:500;margin-bottom:26px;font-style:italic}
.card{background:none;border:0;border-radius:0;padding:26px 4px;box-shadow:none;text-align:center;position:relative}
.card::before{content:none}
.card+.card{margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 24px;border-radius:999px;border:1px solid #c9a86e;background:linear-gradient(180deg,#fffdf9,#f6efe6);color:var(--crimson-deep);font:500 11px var(--caps);letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 6px 16px -8px rgba(125,11,32,.35),inset 0 0 0 3px rgba(255,255,255,.7),inset 0 0 0 4px rgba(201,168,110,.35);transition:transform .3s var(--ease),box-shadow .3s}
.btn:hover,.btn:active{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(125,11,32,.45),inset 0 0 0 3px rgba(255,255,255,.7),inset 0 0 0 4px rgba(201,168,110,.45)}
.btn.solid{background:radial-gradient(120% 140% at 30% 0%,#d8324f,#a3132d 55%,#6f0a1d);border-color:#e3c08a;color:#fff6e8;box-shadow:0 8px 20px -8px rgba(125,11,32,.6),inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 3px rgba(111,10,29,.4),inset 0 0 0 4px rgba(227,192,138,.55)}
.btn svg{flex:none}
.divider{display:flex;justify-content:center;padding:10px 0 0;color:var(--crimson)}
.divider svg{width:120px;height:auto}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}*{animation:none!important}}

/* ---------- TOP BAR: language pill + music ---------- */
#bar{position:fixed;top:12px;left:0;right:0;z-index:50;display:flex;justify-content:flex-end;gap:8px;max-width:480px;margin:0 auto;padding:0 14px;pointer-events:none}
#bar>*{pointer-events:auto}
.pill{display:flex;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.pill button{border:0;background:transparent;font:500 12px var(--caps);letter-spacing:.14em;padding:7px 13px;border-radius:999px;color:var(--ink);cursor:pointer;min-height:32px}
.pill button.on{background:var(--ink);color:#fff}
#mute{position:fixed;right:max(14px,calc(50% - 226px));bottom:18px;z-index:50;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.9);box-shadow:var(--shadow);font-size:18px;cursor:pointer;display:none}
body.opened #mute.has{display:block}

/* ---------- OPENER (data-opener: seal | doors | curtain | none) ---------- */
#opener{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#efe6d6;transition:opacity 1.1s var(--ease) .2s,visibility 0s 1.4s}
#opener.done{opacity:0;visibility:hidden;pointer-events:none}
/* paper texture without images: layered gradients + noise via SVG filter */
.paper{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.7),transparent 60%),
  radial-gradient(90% 60% at 50% 100%,rgba(168,128,60,.12),transparent 70%),#f1e8d8}
.paper::after{content:"";position:absolute;inset:0;opacity:.28;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .5 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
/* envelope flap lines */
.flap{position:absolute;left:0;right:0;top:0;height:52%;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#e9dcc4,#f3ead9);filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));transform-origin:top;transition:transform 1.1s var(--ease)}
#opener.open .flap{transform:rotateX(180deg)}
.fold-l,.fold-r{position:absolute;bottom:0;width:100%;height:60%;background:#f4ecdc;opacity:.55}
.fold-l{clip-path:polygon(0 0,0 100%,60% 100%)} .fold-r{clip-path:polygon(100% 0,100% 100%,40% 100%)}
/* the seal: pure CSS wax + monogram */
.seal{position:relative;z-index:3;width:150px;height:150px;border:0;border-radius:50%;cursor:pointer;margin-top:4vh;
  background:radial-gradient(circle at 35% 30%,#e8cf93,var(--accent) 55%,#7a5a22);box-shadow:inset 0 0 0 6px rgba(255,255,255,.18),inset 0 -8px 16px rgba(0,0,0,.25),0 14px 26px rgba(60,40,10,.35);
  display:flex;align-items:center;justify-content:center;transition:transform .5s var(--ease),opacity .6s}
.seal::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1.5px solid rgba(255,248,234,.55)}
.seal span{font:400 46px/1 var(--script);color:rgba(255,248,234,.95);text-shadow:0 1px 0 rgba(0,0,0,.3);position:relative}
.seal::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--accent);opacity:.5;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
#opener.open .seal{transform:scale(1.3);opacity:0}
.hint{position:absolute;bottom:9vh;left:0;right:0;text-align:center;z-index:3;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#opener.open .hint{opacity:0}
.guestline{position:absolute;top:11vh;left:0;right:0;text-align:center;z-index:3;font:italic 22px var(--serif);color:var(--ink-soft);padding:0 30px}
/* doors */
.door{position:absolute;top:0;bottom:0;width:50.2%;background:#35503f;transition:transform 1.4s var(--ease)}
.door.l{left:0}.door.r{right:0}
.door::after{content:"";position:absolute;inset:0;opacity:.3;mix-blend-mode:multiply;background:inherit}
#opener.open .door.l{transform:translateX(-102%)}#opener.open .door.r{transform:translateX(102%)}
#opener[data-opener=doors] .seal{border-radius:36% 36% 44% 44%/30% 30% 50% 50%;width:130px;height:160px;background:linear-gradient(#f8f1e3,#eadfc9);box-shadow:var(--shadow)}
#opener[data-opener=doors] .seal span{color:#5b4a2c;text-shadow:none}
#opener[data-opener=doors] .seal::before{border-color:#c9b38a}
/* curtain */
.cur{position:absolute;top:0;bottom:0;width:50.2%;background:repeating-linear-gradient(90deg,#7c1214 0 14px,#8c191c 14px 20px,#6b0f11 20px 34px);box-shadow:inset 0 -30px 60px rgba(0,0,0,.4);transition:transform 1.6s var(--ease)}
.cur.l{left:0}.cur.r{right:0}
#opener.open .cur.l{transform:translateX(-102%)}#opener.open .cur.r{transform:translateX(102%)}

/* ---------- COVER ---------- */
/* the photo is the cover: names sit on the white wall above the couple, the date on the gown below */
#cover{min-height:100svh;padding:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--ink);overflow:hidden;background:#f3efea}
#cover .bg{position:absolute;inset:0;background-size:cover;background-position:50% 30%;transform:scale(1);animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.06)}}
#cover .shade{position:absolute;inset:0;background:linear-gradient(rgba(250,247,244,.92) 0%,rgba(250,247,244,.55) 22%,rgba(250,247,244,0) 40%,rgba(20,8,12,0) 58%,rgba(20,8,12,.78) 100%)}
#cover .in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:100svh;padding:54px 16px 96px;width:100%}
#cover .top img{width:44px;display:block;margin:0 auto 6px}
#cover .top .te{font-size:13.5px;color:var(--crimson-deep);font-weight:500}
#cover .caps{color:var(--ink);opacity:.9}
#cover .names{font:400 clamp(50px,14.5vw,66px)/.9 var(--script);color:var(--crimson);margin-top:4px;white-space:nowrap}
#cover .names .amp{display:inline-block;font-size:.55em;color:var(--ink);margin:0 .12em;vertical-align:.18em}
#cover .low{color:#fff}
#cover .low .caps{color:#fff;opacity:.95}
#cover .date{font:500 18px var(--caps);letter-spacing:.32em;text-transform:uppercase;color:#fff}
#cover .sd{font:400 clamp(46px,13.5vw,60px)/1 var(--script);color:#fff;text-shadow:0 2px 14px rgba(60,0,15,.55);margin:6px 0 2px;white-space:nowrap}
#cover .sd sup{font:500 12px var(--caps);letter-spacing:.1em;vertical-align:1.6em;margin-left:2px}
#cover .low .te{font-size:15px;letter-spacing:.02em}
#cover .low .te{font-size:14px;margin-top:4px;opacity:.95}
.chev{display:block;margin:10px auto 0;animation:bob 2s ease-in-out infinite}
/* invocation and invitation */
.invoc{display:flex;justify-content:space-between;max-width:330px;margin:0 auto 18px;font:500 13px var(--te);color:var(--crimson-deep)}
.gan{width:58px;display:block;margin:0 auto 8px}
.wording{text-align:center;max-width:360px;margin:0 auto}
.wording .lead{font-style:italic;font-weight:500;font-size:18px;color:var(--ink)}
.wording .who{font:400 clamp(32px,9.8vw,42px)/1 var(--script);color:var(--crimson);margin:16px 0 0;white-space:nowrap}
.wording .who small{font:500 11px var(--caps);letter-spacing:.2em;color:var(--ink-soft);vertical-align:.6em;margin-left:4px}
.wording .with{font:500 11px var(--caps);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);margin:6px 0 2px}
.wording .par{font-style:italic;font-weight:500;font-size:16.5px;color:var(--ink-soft)}
.te-line{font:500 15px/1.7 var(--te);color:var(--crimson-deep);text-align:center;margin-top:18px}
/* events */
.evt h3.script{font-size:52px;color:var(--crimson);margin:2px 0 4px}
.evt .when{font:500 13px var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.evt .tm{font-style:italic;font-weight:500;color:var(--ink)}
.evt .place{font:600 16px var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:14px}
.evt .addr{color:var(--ink-soft);font-weight:500;font-size:16.5px;line-height:1.5}
/* hosts */
.hosts p{font:500 20px/1.4 var(--serif);color:var(--ink)}
.hosts .from{font:500 16px/1.5 var(--serif);font-style:italic;color:var(--ink-soft);margin-top:8px}

/* ---------- COUNTDOWN ---------- */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto}
.cd div{background:none;border:0;padding:10px 2px 6px;text-align:center;position:relative}.cd div+div::before{content:'';position:absolute;left:0;top:18%;bottom:18%;width:1px;background:rgba(179,18,46,.35)}
.cd b{display:block;font:400 34px/1 var(--serif);color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.cd small{font:600 10px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--crimson)}

/* ---------- TIMELINE ---------- */
.tl{position:relative;margin:8px auto 0;max-width:340px;text-align:left}
.tl::before{content:"";position:absolute;left:64px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl li{list-style:none;display:grid;grid-template-columns:52px 1fr;gap:26px;padding:10px 0;position:relative}
.tl li::after{content:"";position:absolute;left:60px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl time{font:500 16px var(--serif);color:var(--accent);text-align:right}
.tl span{font:500 13px var(--caps);letter-spacing:.2em;text-transform:uppercase}
.tl em{display:block;font-size:15px;color:var(--ink-soft)}

/* ---------- RSVP ---------- */
#rsvp{background:linear-gradient(160deg,#c3a268,#a8803c 55%,#8f6a2c);color:#fff}
#rsvp h2.script,#rsvp .sub{color:#fff}
.form{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow);text-align:left}
.form label.q{display:block;font:500 12px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 8px}
.opt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;min-height:48px}
.opt input{accent-color:var(--accent);width:18px;height:18px}
.opt:has(input:checked){border-color:var(--accent);background:#fff7e6}
.form input[type=text],.form textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:#fff;color:var(--ink);min-height:46px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;color:var(--ink);cursor:pointer}
.stepper output{font:500 22px var(--serif);min-width:24px;text-align:center}
.person{background:#f6efe2;border-radius:12px;padding:12px;margin-top:10px}
.person .caps{display:block;margin-bottom:8px}
.person input+input{margin-top:8px}
.hp{position:absolute!important;left:-9999px;opacity:0;height:0;width:0}
.thanks{text-align:center;padding:30px 10px;display:none}
.thanks .script{font-size:44px}
footer{position:relative;overflow:hidden;min-height:100svh;padding:120px 22px 120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#3a0a16,var(--night) 70%);color:#eadcd6}
footer > *{position:relative;z-index:1}
footer .fghost{position:absolute;inset:0;z-index:0;background:url(couple.jpg) 50% 30%/cover no-repeat;opacity:.22;-webkit-mask-image:radial-gradient(ellipse 70% 50% at 50% 46%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse 70% 50% at 50% 46%,#000 25%,transparent 75%)}
footer .fgan{width:52px;display:block;margin:0 auto 10px}
footer .fnames{font:400 clamp(54px,16vw,70px)/.95 var(--script);color:#fff;white-space:nowrap;margin-top:12px}
footer .fnames span{font-size:.6em;color:#d9b36e}
footer .fdate{font:600 14px var(--caps);letter-spacing:.4em;padding-left:.4em;text-transform:uppercase;color:#e9d29a;margin-top:18px}
footer .fday{font:500 15px var(--te);color:#eadcd6;margin-top:6px}
footer .ftag{font:600 11.5px var(--caps);letter-spacing:.34em;color:#d9b9a8;margin-top:56px}
footer .script{color:#fff;font-size:68px;line-height:.9}
footer .caps{color:#d9b9a8}
.hidden{display:none!important}
.copy{background:none;border:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;min-height:36px}

/* ---------- VIDEO HERO / OPENER ---------- */
#cover video.vbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#opener video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.skip{position:fixed;top:14px;left:14px;z-index:120;border:1px solid rgba(90,63,36,.35);background:rgba(255,255,255,.6);backdrop-filter:blur(6px);border-radius:999px;padding:0 16px;min-height:34px;font:500 11px var(--caps);letter-spacing:.2em;color:var(--ink);cursor:pointer}
.bow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:270px;border:0;background:none;cursor:pointer;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));transition:transform .9s var(--ease),opacity .9s}
#opener.open .bow{opacity:0;transform:translate(-50%,-35%) scale(1.25)}
#opener[data-opener=ribbon] .seal{display:none}
.emboss{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:3;text-align:center;font:italic 26px/1.3 var(--serif);color:var(--ink-soft);padding:0 34px}

/* ---------- AMBIENT FX (CSS only; deterministic positions) ---------- */
.fxl{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.fxl.page{position:fixed;z-index:30;max-width:480px;margin:0 auto;left:0;right:0}
.fx{position:absolute;top:-6%;left:var(--x);width:var(--s);height:var(--s);opacity:0;animation-duration:var(--d);animation-delay:var(--dl);animation-iteration-count:infinite;animation-timing-function:linear}
.fx.petal{background:var(--fxc,#f2b8c0);border-radius:80% 0 80% 0;animation-name:fall}
.fx.leaf{background:var(--fxc,#7f9c63);border-radius:0 90% 0 90%;animation-name:fall}
.fx.dust{top:var(--y);background:#fff;border-radius:50%;animation-name:drift;animation-timing-function:ease-in-out}
.fx.spark{top:var(--y);background:var(--fxc,#fff);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation-name:twinkle;animation-timing-function:ease-in-out}
.fx.fly{top:var(--y);background:#ffe9a8;border-radius:50%;box-shadow:0 0 10px 4px rgba(255,226,140,.65);animation-name:flit;animation-timing-function:ease-in-out}
.fx.shoot{top:var(--y);height:1.5px;width:90px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(25deg);animation-name:shoot}
@keyframes fall{0%{opacity:0;transform:translate3d(0,-5vh,0) rotate(0)}10%{opacity:.9}50%{transform:translate3d(30px,55vh,0) rotate(180deg)}100%{opacity:.8;transform:translate3d(-20px,112vh,0) rotate(360deg)}}
@keyframes drift{0%,100%{opacity:0;transform:translate3d(0,0,0)}50%{opacity:.55;transform:translate3d(14px,-26px,0)}}

      <div id="people"></div>

      <label class="opt"><input type="radio" name="kids" value="no" checked> ${U("noK")}</label>
    </div>
    <label class="q" for="msg">${U("msg")}</label>
    <textarea id="msg" rows="3"></textarea>
    <button class="btn solid" type="submit" style="width:100%;margin-top:20px">${U("send")}</button>
  </form>
  <div class="thanks card reveal" id="thanks"><p class="script">${U("thanks")}</p><p>${U("thanksSub")}</p></div></section>`
};

/* ---------- this couple's own sections ---------- */

R.invite=()=>{const v=CFG.invite;return `<section id="invite">

  <img class="gan reveal" src="ganesh-crimson.png" alt="Lord Ganesha">

/* ---------- build ---------- */
function build(){
  const app=document.getElementById("app");
  const bg=CFG.hero.image?`url('${CFG.hero.image}')`:CFG.hero.gradient;
  const nm=lang==="te"?CFG.namesTe:CFG.names;
  app.innerHTML=`<section id="cover"><div class="bg" style="background-image:${bg}"></div><div class="shade"></div><div class="in">
    <div class="top"><img src="ganesh-crimson.png" alt="Lord Ganesha"><p class="te">${esc(T(CFG.kicker))}</p>
      <h1 class="names ${lang==="te"?"te-d":""}" ${lang==="te"?'style="font-size:44px;line-height:1.2"':""}>${esc(nm[0])}<span class="amp">&amp;</span>${esc(nm[1])}</h1></div>
    <div class="low"><p class="caps" style="letter-spacing:.42em">${lang==="te"?"శుభ ముహూర్తం":"Save the date"}</p><p class="sd">${lang==="te"?'<span class="te-d" style="font-size:30px">25 నవంబర్ 2026</span>':"25<sup>th</sup> November 2026"}</p><p class="te">${esc(T(CFG.dayText))}</p></div></div></section>`
    + CFG.sections.map(k=>R[k]?R[k]():"").join("")
    + `<footer><div class="fghost" aria-hidden="true"></div><img class="fgan" src="ganesh-gold.png" alt="Lord Ganesha"><div class="divider" style="color:#c8283f">${MOTIF.rose}</div><p class="fnames">${esc(CFG.names[0])} <span>&amp;</span> ${esc(CFG.names[1])}</p><p class="fdate">25 · November · 2026</p><p class="fday">బుధవారం · ఉదయం 11:30</p><p class="ftag">${esc(T(CFG.footer))}</p></footer>`;
  const lg=document.getElementById("lang");
  lg.innerHTML=CFG.langs.length>1?CFG.langs.map(l=>`<button class="${l===lang?"on":""}" data-l="${l}">${l.toUpperCase()}</button>`).join(""):"";
  lg.style.display=CFG.langs.length>1?"flex":"none";
  document.querySelectorAll('#app > section:not(#cover), #app > footer').forEach(sec=>{['l','r'].forEach(side=>{const d=document.createElement('div');d.className='sdeco '+side;d.innerHTML=SDECO;sec.prepend(d)})});
  const ft=document.querySelector('#app > footer');if(ft)['bl','br'].forEach(c=>{const d=document.createElement('div');d.className='sdeco '+c;d.innerHTML=SDECO;ft.appendChild(d)});
  wire();startFx();
}
function wire(){
  // scroll reveal
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  // countdown
  const cd=document.getElementById("cd");
  if(cd){const target=new Date(CFG.date).getTime();const tick=()=>{let s=Math.max(0,Math.floor((target-Date.now())/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];cd.querySelectorAll("b").forEach((b,i)=>b.textContent=String(v[i]).padStart(2,"0"))};tick();clearInterval(window.__cd);window.__cd=setInterval(tick,1000)}
  // calendar (.ics built in page)
  const cal=document.getElementById("cal");
  if(cal)cal.onclick=()=>makeICS(CFG.date,CFG.title+" wedding",CFG.venue.name+", "+CFG.venue.address);
  document.querySelectorAll("[data-ics]").forEach(b=>b.onclick=()=>makeICS(b.dataset.ics,b.dataset.t,b.dataset.l));
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);b.textContent=U("copied")});
  // RSVP
  const form=document.getElementById("rsvpForm");
  if(form){
    let n=1;const people=document.getElementById("people"),cnt=document.getElementById("cnt");
    const draw=()=>{cnt.textContent=n;const keep=[...people.querySelectorAll(".person")].map(p=>[p.querySelector("[name=pn]").value,p.querySelector("[name=pd]").value]);people.innerHTML=Array.from({length:n},(_,i)=>`<div class="person"><span class="caps">${U("person")} ${i+1}</span><input type="text" name="pn" placeholder="${U("name")}" value="${esc((keep[i]||[])[0]||(i===0?guest:""))}"><input type="text" name="pd" placeholder="${U("diet")}" value="${esc((keep[i]||[])[1]||"")}"></div>`).join("")};
    draw();
    document.getElementById("plus").onclick=()=>{if(n<maxGuests){n++;draw()}};
    document.getElementById("minus").onclick=()=>{if(n>1){n--;draw()}};
    form.querySelectorAll("[name=att]").forEach(r=>r.onchange=()=>document.getElementById("more").classList.toggle("hidden",form.att.value==="no"));
    form.onsubmit=ev=>{ev.preventDefault();if(form.website.value)return; // honeypot
      const attending=form.att.value==="yes";
      const payload={guest,attending,count:attending?n:0,people:attending?[...people.querySelectorAll(".person")].map(p=>({name:p.querySelector("[name=pn]").value.trim(),diet:p.querySelector("[name=pd]").value.trim()})):[],kids:attending&&form.kids.value==="yes",message:document.getElementById("msg").value.trim(),lang,ts:new Date().toISOString()};
      if(attending&&!payload.people[0].name){people.querySelector("[name=pn]").focus();return}
      submitRSVP(payload).then(()=>{form.style.display="none";const t=document.getElementById("thanks");t.style.display="block";t.classList.add("in")});
    };
  }
}
function summary(p){return `${CFG.title}: ${p.attending?"Attending ("+p.count+")":"Cannot attend"}\n`+p.people.map(x=>"- "+x.name+(x.diet?" ("+x.diet+")":"")).join("\n")+(p.kids?"\nChildren: yes":"")+(p.message?"\n\""+p.message+"\"":"")+(p.guest?"\nFrom: "+p.guest:"")}
async function submitRSVP(p){
  const r=CFG.rsvp;
  if(r.mode==="whatsapp"&&r.whatsapp){location.href="https://wa.me/"+r.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent(summary(p));return}
  if(r.mode==="mailto"&&r.email){location.href="mailto:"+r.email+"?subject="+encodeURIComponent("RSVP "+CFG.title)+"&body="+encodeURIComponent(summary(p));return}
  if(r.mode==="endpoint"&&r.endpoint){
    const opts=r.format==="form"?{method:"POST",body:new URLSearchParams({data:JSON.stringify(p),...Object.fromEntries(Object.entries(p).filter(([k,v])=>typeof v!=="object"))})}:{method:"POST",mode:"no-cors",body:JSON.stringify(p)};
    try{await fetch(r.endpoint,opts)}catch(e){}return}
  console.warn("RSVP not delivered: set CFG.rsvp.mode and its target.",p);   // never silently pretend in production
}

/* ---------- opener ---------- */
function buildOpener(){
  const o=document.getElementById("opener");const kind=CFG.opener;
  if(kind==="none"){o.remove();document.body.classList.remove("locked");document.body.classList.add("opened");return}
  o.dataset.opener=kind;
  const mono=esc(CFG.monogram);
  const sealBtn=`<button class="seal" id="sealBtn" aria-label="${U("tap")}"><span>${mono}</span></button>`;
  const hint=`<p class="hint caps">${U("tap")}</p>`;
  const gl=guest?`<p class="guestline">${esc(guest)}</p>`:"";
  if(kind==="seal"||kind==="tulle")o.innerHTML=`<div class="paper"></div><div class="fold-l"></div><div class="fold-r"></div><div class="flap"></div>${gl}${sealBtn}${hint}`;
  if(kind==="doors")o.innerHTML=`<div class="paper"></div><div class="door l" style="background:${CFG.doorsColor}"></div><div class="door r" style="background:${CFG.doorsColor}"></div>${gl}${sealBtn}${hint}`;
  if(kind==="curtain")o.innerHTML=`<div class="cur l"></div><div class="cur r"></div>${sealBtn.replace('class="seal"','class="seal" style="background:radial-gradient(circle at 35% 30%,#f6e6b5,#c99a3d 55%,#7a5a22)"')}${hint}`;
  // ribbon: gatefold doors tied with a bow (the bow is the button)
  if(kind==="ribbon"){
    // art-deco gold corner, gold medallion seal with the wine Ganesha and the couple's initials
    const deco=pos=>`<svg class="deco ${pos}" viewBox="0 0 86 86" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 80V6h74"/><path d="M12 80V12h68" opacity=".55"/><path d="M6 30C20 30 30 20 30 6"/><path d="M6 44C28 44 44 28 44 6" opacity=".6"/><path d="M18 18l8 8M18 26l8-8" opacity=".8"/><circle cx="22" cy="22" r="2.2" fill="currentColor"/><path d="M52 6c0 6 4 10 10 10M6 52c6 0 10 4 10 10" opacity=".7"/></svg>`;
    const medal=`<button class="medal" id="sealBtn" aria-label="${U("tap")}"><svg viewBox="0 0 140 140"><defs>
      <radialGradient id="mg" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff4d2"/><stop offset=".35" stop-color="#e6c785"/><stop offset=".7" stop-color="#b48a3f"/><stop offset="1" stop-color="#7d5a22"/></radialGradient>
      <linearGradient id="mr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2ad"/><stop offset=".5" stop-color="#a67c2e"/><stop offset="1" stop-color="#f0d79c"/></linearGradient>
      <path id="arcTop" d="M24 70A46 46 0 0 1 116 70"/><path id="arcBot" d="M17 70A53 53 0 0 0 123 70"/></defs>
      <circle cx="70" cy="70" r="66" fill="url(#mg)"/><circle cx="70" cy="70" r="62" fill="none" stroke="url(#mr)" stroke-width="2"/>
      <circle cx="70" cy="70" r="56" fill="none" stroke="#7d5a22" stroke-opacity=".5" stroke-width=".8" stroke-dasharray="1.2 3"/>
      <circle cx="70" cy="70" r="38" fill="none" stroke="#7d5a22" stroke-opacity=".55" stroke-width=".8"/>
      <g font-family="Bodoni Moda, serif" font-size="8.4" letter-spacing="2" fill="#6e0a1e" fill-opacity=".88"><text><textPath href="#arcTop" startOffset="50%" text-anchor="middle">NANDINI · NIKHIL</textPath></text><text><textPath href="#arcBot" startOffset="50%" text-anchor="middle">25 NOVEMBER 2026</textPath></text></g><g fill="#6e0a1e" fill-opacity=".75"><path d="M20.5 70l2.5-2.5 2.5 2.5-2.5 2.5z"/><path d="M114.5 70l2.5-2.5 2.5 2.5-2.5 2.5z"/></g>
      <image href="ganesh-wine.png" x="51" y="47" width="38" height="42"/></svg></button>`;
    const door=side=>`<div class="door ${side}">${deco("t")}${deco("b")}</div>`;
    const content=`<div class="ocontent"><img src="ganesh-gold.png" alt="Lord Ganesha"><p class="te foil">ఆంగోత్ వారి పెండ్లి పిలుపు</p>
      <p class="nm foil">Nandini <span>&amp;</span> Nikhil</p>
      <svg class="rule" viewBox="0 0 150 14" fill="none" stroke="#d9b36e" stroke-width=".8"><path d="M0 7h60M90 7h60"/><path d="M75 1l6 6-6 6-6-6z" fill="#d9b36e"/></svg>
      <p class="dt">25 · NOVEMBER · 2026</p></div>`;
    o.innerHTML=`${door("l")}${door("r")}${content}${gl}${medal}<p class="hint caps">${U("tap")}</p>`}
  // video: a rendered envelope-opening clip supplied by the user (mp4/webm); tap plays it, SKIP jumps ahead
  if(kind==="video"&&CFG.openerVideo)o.innerHTML=`<video src="${esc(CFG.openerVideo)}" poster="${esc(CFG.openerPoster||"")}" muted playsinline preload="auto"></video>${gl}<button class="seal" id="sealBtn" style="opacity:0" aria-label="${U("tap")}"><span></span></button>${hint}`;
  if(CFG.openerText&&kind!=="curtain")o.insertAdjacentHTML("beforeend",`<p class="emboss">${esc(T(CFG.openerText))}</p>`);
  const finish=()=>{if(o.classList.contains("done"))return;o.classList.add("open");
    if(CFG.music){const a=document.getElementById("music");a.src=CFG.music;a.volume=.5;a.play().catch(()=>{});const m=document.getElementById("mute");m.classList.add("has");m.onclick=()=>{a.paused?a.play():a.pause();m.style.opacity=a.paused?.55:1}}
    const sk=document.getElementById("skipBtn");if(sk)sk.remove();
    setTimeout(()=>{o.classList.add("done");document.body.classList.remove("locked");document.body.classList.add("opened");if(CFG.scratch.enabled)scratch();setTimeout(()=>o.remove(),1600)},kind==="video"?300:1500)};
  const vid=o.querySelector("video");
  const open=()=>{if(o.classList.contains("open")||o.dataset.playing)return;
    if(vid){o.dataset.playing=1;vid.play().then(()=>{vid.onended=finish;setTimeout(finish,Math.min(12000,((vid.duration||5)+1)*1000))}).catch(finish);return}
    finish()};
  document.querySelectorAll(".skip").forEach(x=>x.remove());
  if(CFG.skip){const s=document.createElement("button");s.id="skipBtn";s.className="skip";s.textContent=U("skip").toUpperCase();s.onclick=finish;document.body.appendChild(s)}
  o.querySelector("#sealBtn").onclick=open;o.onclick=e=>{if(e.target===o||e.target===vid)open()};
}

/* ---------- scratch to reveal (canvas, finger or mouse) ---------- */
function scratch(){
  const cover=document.querySelector("#cover .in p.date");if(!cover)return;
  const box=document.createElement("div");box.className="scratchbox";box.style.margin="16px auto";
  box.style.cssText="margin:12px auto 6px;width:min(250px,72%);aspect-ratio:5/3;border-radius:2px;background:rgba(255,255,255,.96)";
  box.innerHTML=`<div class="under" style="font:500 19px var(--caps);letter-spacing:.14em;color:var(--crimson);line-height:1.2;white-space:nowrap">25 · 11 · 2026<br><span style="font:400 40px/1 var(--script);letter-spacing:0;color:var(--ink)">${lang==="te"?"":"November"}</span></div><canvas></canvas>`;cover.replaceWith(box);
  const c=box.querySelector("canvas"),ctx=c.getContext("2d");const w=c.width=box.clientWidth*2,h=c.height=box.clientHeight*2;
  // crimson silk foil
  const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,"#7d0b20");g.addColorStop(.35,"#c81d3a");g.addColorStop(.5,"#e5506a");g.addColorStop(.65,"#b3122e");g.addColorStop(1,"#6a0919");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=2;for(let x=-h;x<w;x+=18){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+h,h);ctx.stroke()}
  ctx.strokeStyle="rgba(232,201,160,.8)";ctx.lineWidth=2;ctx.strokeRect(10,10,w-20,h-20);
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="64px Italianno, cursive";ctx.fillText(lang==="te"?"Scratch":"Scratch",w/2,h/2+8);
  ctx.font="500 16px 'Bodoni Moda', 'Noto Serif Telugu', serif";ctx.fillText((lang==="te"?"తాకి / గీకి చూడండి":"T A P   T O   R E V E A L"),w/2,h/2+46);
  ctx.globalCompositeOperation="destination-out";let down=false,t=0,gone=false;
  const reveal=()=>{if(gone)return;gone=true;c.style.transition="opacity 1.2s ease";c.style.opacity=0;setTimeout(()=>c.remove(),1300)};
  const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*2,(p.clientY-r.top)*2]};
  const dot=e=>{if(!down)return;const[x,y]=pos(e);ctx.beginPath();ctx.arc(x,y,34,0,7);ctx.fill();if(++t%10===0){const d=ctx.getImageData(0,0,w,h).data;let n=0;for(let i=3;i<d.length;i+=64)if(d[i]===0)n++;if(n/(d.length/64)>.35)reveal()}};
  // a single tap also reveals; a swipe scratches
  let sx=0,sy=0;c.addEventListener("pointerdown",e=>{down=true;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);dot(e)});c.addEventListener("pointermove",dot);
  c.addEventListener("pointerup",e=>{down=false;if(Math.hypot(e.clientX-sx,e.clientY-sy)<8)reveal()});
}

/* ---------- scroll cue: shows on every section once opened, rests while scrolling, hides at the end ---------- */
(()=>{
  const cue=document.getElementById("scrollCue");let idle=null;
  const atEnd=()=>innerHeight+scrollY>=document.documentElement.scrollHeight-140;
  const update=()=>{if(document.body.classList.contains("opened"))cue.classList.toggle("show",!atEnd())};
  cue.onclick=()=>{const next=[...document.querySelectorAll("#app > section, #app > footer")].find(s=>s.getBoundingClientRect().top>24);if(next)next.scrollIntoView({behavior:"smooth",block:"start"})};
  addEventListener("scroll",()=>{cue.classList.remove("show");clearTimeout(idle);idle=setTimeout(update,650)},{passive:true});
  addEventListener("resize",update);
  new MutationObserver(()=>setTimeout(update,900)).observe(document.body,{attributes:true,attributeFilter:["class"]});
})();

/* ---------- language switch ---------- */
document.getElementById("lang").addEventListener("click",e=>{const l=e.target.dataset&&e.target.dataset.l;if(!l||l===lang)return;lang=l;try{localStorage.setItem("lang",l)}catch(x){}document.documentElement.lang=l;build();});

document.documentElement.lang=lang;
applyTheme(CFG.theme);loadFonts(CFG.fonts);
build();buildOpener();dayNight();
